services:
  app:
    image: ghcr.io/luiscruz-1/crm-moodle:latest
    restart: always
    volumes:
      - storage_data:/var/www/html/storage
      - storage_private:/var/www/html/storage/app/private
    depends_on:
      - db
      - redis
    networks:
      - app-network
    labels:
      - traefik.enable=true
      - "traefik.http.routers.crm-moodle.rule=Host(`crm.micrudev.tech`) || Host(`alumnos.micrudev.tech`)"
      - "traefik.http.routers.crm-moodle.service=crm-moodle"
      - traefik.http.routers.crm-moodle.tls=true
      - traefik.http.routers.crm-moodle.entrypoints=websecure
      - traefik.http.routers.crm-moodle.tls.certresolver=letsencrypt
      - traefik.http.services.crm-moodle.loadbalancer.server.port=80

  worker:
    image: ghcr.io/luiscruz-1/crm-moodle:latest
    restart: always
    command: sh -lc "php -r '$h=getenv(\"DB_HOST\"); $db=getenv(\"DB_DATABASE\"); $u=getenv(\"DB_USERNAME\"); $p=getenv(\"DB_PASSWORD\"); $port=getenv(\"DB_PORT\") ?: 3306; for ($i=0;$i<60;$i++){ try{ new PDO(\"mysql:host=$h;port=$port;dbname=$db\",$u,$p); exit(0);} catch (Throwable $e){ sleep(2);} } fwrite(STDERR,\"db_not_ready\\n\"); exit(1);' && php artisan queue:work redis --sleep=3 --tries=3 --timeout=90"
    depends_on:
      - db
      - redis
    networks:
      - app-network

  scheduler:
    image: ghcr.io/luiscruz-1/crm-moodle:latest
    restart: always
    command: sh -lc "php -r '$h=getenv(\"DB_HOST\"); $db=getenv(\"DB_DATABASE\"); $u=getenv(\"DB_USERNAME\"); $p=getenv(\"DB_PASSWORD\"); $port=getenv(\"DB_PORT\") ?: 3306; for ($i=0;$i<60;$i++){ try{ new PDO(\"mysql:host=$h;port=$port;dbname=$db\",$u,$p); exit(0);} catch (Throwable $e){ sleep(2);} } fwrite(STDERR,\"db_not_ready\\n\"); exit(1);' && php artisan schedule:work"
    depends_on:
      - db
      - redis
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  storage_data:
  storage_private:
