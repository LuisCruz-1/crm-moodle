services:
  app:
    build: .
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
    env_file:
      - .env
    volumes:
      - storage_private:/var/www/html/storage/app/private
    depends_on:
      - db
      - redis
    networks:
      - app-network
      - traefik-public
    labels:
      - traefik.enable=true
      - "traefik.http.routers.crm.rule=Host(\`${CRM_HOST}\`,\`${PORTAL_HOST}\`)"
      - traefik.http.routers.crm.tls=true
      - traefik.http.routers.crm.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.crm.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.crm.loadbalancer.server.port=80

  worker:
    build: .
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - app-network

  scheduler:
    build: .
    restart: always
    command: php artisan schedule:work
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  traefik-public:
    external: true

volumes:
  db_data:
  storage_private:
