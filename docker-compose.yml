services:
  app:
    image: ghcr.io/luiscruz-1/crm-moodle:latest
    restart: always
    environment:
      APP_NAME: "CRM Academico"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "https://crm.micrudev.tech"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: crm_academico
      DB_USERNAME: crm_user
      DB_PASSWORD: "SuperPasswordSecreta123"
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      CRM_HOST: "crm.micrudev.tech"
      PORTAL_HOST: "alumnos.micrudev.tech"
      TRAEFIK_ENTRYPOINT: websecure
      TRAEFIK_CERTRESOLVER: letsencrypt
      MAIL_MAILER: log
      MAIL_HOST: "127.0.0.1"
      MAIL_PORT: "2525"
      MAIL_FROM_ADDRESS: "hello@example.com"
      MAIL_FROM_NAME: "CRM Academico"
    volumes:
      - storage_private:/var/www/html/storage/app/private
    depends_on:
      - db
      - redis
    networks:
      - app-network
    labels:
      - traefik.enable=true
      - "traefik.http.routers.crm.rule=Host(`crm.micrudev.tech`,`alumnos.micrudev.tech`)"
      - traefik.http.routers.crm.tls=true
      - traefik.http.routers.crm.entrypoints=websecure
      - traefik.http.routers.crm.tls.certresolver=letsencrypt
      - traefik.http.services.crm.loadbalancer.server.port=80

  worker:
    image: ghcr.io/luiscruz-1/crm-moodle:latest
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: crm_academico
      DB_USERNAME: crm_user
      DB_PASSWORD: "SuperPasswordSecreta123"
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - db
      - redis
    networks:
      - app-network

  scheduler:
    image: ghcr.io/luiscruz-1/crm-moodle:latest
    restart: always
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: crm_academico
      DB_USERNAME: crm_user
      DB_PASSWORD: "SuperPasswordSecreta123"
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - db
      - redis
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: crm_academico
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: "SuperPasswordSecreta123"
      MYSQL_ROOT_PASSWORD: "RootPasswordMuySecreta123"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  storage_private:
