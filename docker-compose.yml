services:
  app:
    image: ghcr.io/luiscruz-1/crm-moodle:latest
    restart: always
    environment:
      - APP_NAME
      - APP_ENV
      - APP_KEY
      - APP_DEBUG
      - APP_URL
      - APP_LOCALE
      - APP_FALLBACK_LOCALE
      - LOG_CHANNEL
      - LOG_LEVEL
      - DB_CONNECTION
      - DB_HOST
      - DB_PORT
      - DB_DATABASE
      - DB_USERNAME
      - DB_PASSWORD
      - REDIS_HOST
      - REDIS_PORT
      - REDIS_PASSWORD
      - REDIS_CLIENT
      - QUEUE_CONNECTION
      - CACHE_STORE
      - SESSION_DRIVER
      - SESSION_LIFETIME
      - SESSION_DOMAIN
      - CRM_HOST
      - PORTAL_HOST
      - TRAEFIK_ENTRYPOINT
      - TRAEFIK_CERTRESOLVER
      - MAIL_MAILER
      - MAIL_SCHEME
      - MAIL_HOST
      - MAIL_PORT
      - MAIL_USERNAME
      - MAIL_PASSWORD
      - MAIL_FROM_ADDRESS
      - MAIL_FROM_NAME
      - SUPERADMIN_NAME
      - SUPERADMIN_EMAIL
      - SUPERADMIN_PASSWORD
    volumes:
      - storage_data:/var/www/html/storage
      - storage_private:/var/www/html/storage/app/private
    depends_on:
      - db
      - redis
    networks:
      - app-network
    labels:
      - traefik.enable=true
      - "traefik.http.routers.crm-moodle.rule=Host(`crm.micrudev.tech`) || Host(`alumnos.micrudev.tech`)"
      - "traefik.http.routers.crm-moodle.service=crm-moodle"
      - traefik.http.routers.crm-moodle.tls=true
      - traefik.http.routers.crm-moodle.entrypoints=websecure
      - traefik.http.routers.crm-moodle.tls.certresolver=letsencrypt
      - traefik.http.services.crm-moodle.loadbalancer.server.port=80

  worker:
    image: ghcr.io/luiscruz-1/crm-moodle:latest
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    environment:
      - APP_ENV
      - APP_KEY
      - APP_DEBUG
      - LOG_CHANNEL
      - LOG_LEVEL
      - DB_CONNECTION
      - DB_HOST
      - DB_PORT
      - DB_DATABASE
      - DB_USERNAME
      - DB_PASSWORD
      - REDIS_HOST
      - REDIS_PORT
      - REDIS_PASSWORD
      - REDIS_CLIENT
      - QUEUE_CONNECTION
      - CACHE_STORE
    depends_on:
      - db
      - redis
    networks:
      - app-network

  scheduler:
    image: ghcr.io/luiscruz-1/crm-moodle:latest
    restart: always
    command: php artisan schedule:work
    environment:
      - APP_ENV
      - APP_KEY
      - APP_DEBUG
      - LOG_CHANNEL
      - LOG_LEVEL
      - DB_CONNECTION
      - DB_HOST
      - DB_PORT
      - DB_DATABASE
      - DB_USERNAME
      - DB_PASSWORD
      - REDIS_HOST
      - REDIS_PORT
      - REDIS_PASSWORD
      - REDIS_CLIENT
      - QUEUE_CONNECTION
      - CACHE_STORE
    depends_on:
      - db
      - redis
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE
      - MYSQL_USER
      - MYSQL_PASSWORD
      - MYSQL_ROOT_PASSWORD
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  storage_data:
  storage_private:
